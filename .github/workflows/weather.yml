name: Daily Weather Push

on:
  schedule:
    - cron: "0 23 * * *"   # UTC 23:00 = 北京时间 07:00
  workflow_dispatch: {}     # 手动触发

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run
        env:
          CAIYUN_TOKEN: ${{ secrets.CAIYUN_TOKEN }}
          CAIYUN_LNG: ${{ secrets.CAIYUN_LNG }}
          CAIYUN_LAT: ${{ secrets.CAIYUN_LAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIMEZONE: ${{ secrets.TIMEZONE }}       # 可选：默认 Asia/Shanghai
          PLACE_NAME: ${{ secrets.PLACE_NAME }}   # 可选：地点名
        run: |
          python weather_push.py
